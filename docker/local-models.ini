version = 1

; Mirobody's local models, for llama.cpp's router (one server, one address):
;   llama-server --models-preset docker/local-models.ini --port 8080
; Each model downloads from Hugging Face the first time it is asked for
; (about 14.5 GB in all) and is cached. Section names are the model ids the
; `local`, `local-utils` and `local-ocr` entries of config.llm.yaml ask for.

[*]
jinja = true
ngl = 99
np = 2

; Reads report photos and pages: GLM-OCR-0.9B, MIT, 1.4 GB.
[glm-ocr]
hf-repo = ggml-org/GLM-OCR-GGUF:Q8_0
c = 16384

; The agent: Qwen3.8-27B quantized by ISTA-DASLab (GSQ-RCO, 3.5 bits), Apache-2.0,
; 13 GB. The tag brings the vision projector; hf-file picks the build that carries
; the multi-token-prediction head, which spec-type uses to write faster.
[qwen3.8-27b]
hf-repo = ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S
hf-file = Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
c = 65536
spec-type = draft-mtp
