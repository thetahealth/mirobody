version = 1

; Mirobody's local models, for llama.cpp's router (one server, one address):
;   llama-server --models-preset docker/local-models.ini --port 8080 --models-max 2
; or the compose `llama` service (`local` profile, CUDA) or `llama_cpu` (the
; `local-cpu` profile), which pass the same flags (docs/local-models.md has the
; line per platform). The router lists every section below and loads one when
; it is asked for (the setup page asks); a model downloads from Hugging Face,
; or the mirror HF_ENDPOINT names, the first time and is cached.
; --models-max 2 keeps one answering model and the document reader in memory,
; so choosing another size unloads the one before. Section names are the model
; ids the two sizes in config.llm.yaml (LOCAL_SETUP) and the `local`,
; `local-utils` and `local-ocr` entries ask for.

[*]
jinja = true
; Every layer on the GPU, as measured (llama.cpp's default, auto, fits them to
; free memory instead). The CPU image logs "no usable GPU found" for it: at
; b11429 llama.cpp warns whenever a build without GPU offload is given this
; option, whatever its value (common/arg.cpp), and the router's own arguments
; override a preset key but cannot remove it, so `llama_cpu` keeps the warning.
ngl = 99
np = 2
; One KV pool both slots share: without it llama.cpp splits c between the two
; slots (kv_unified is on only when np is auto), so a 32k model answered in a
; 16k slot and two of the evaluation's questions ended in ContextOverflowError
; (benchmarks/local_models, 2026-10-06). Same memory: 2.84 GB split, 2.90 GB
; unified, MiniCPM5-2B at c = 32768.
kv-unified = true
; The prompt cache in host memory (llama.cpp's --cache-ram) defaults to 8 GiB per
; model server, and the router runs one server per model: measured 2026-10-06 on
; a 16 GB Mac, MiniCPM5-2B and GLM-OCR held 8.0 and 9.0 GB after twenty minutes
; of questions, against 1.6 and 1.4 GB of weights, and the machine swapped
; until its disk was full. 1 GiB keeps the last conversations reusable.
cache-ram = 1024

; Reads report photos and pages, with every answering model: GLM-OCR-0.9B,
; MIT, 1.4 GB with its vision projector.
[glm-ocr]
hf-repo = ggml-org/GLM-OCR-GGUF:Q8_0
c = 16384
; Every request is a new page image: nothing to reuse.
cache-ram = 0

; The other reader, not asked for by default (`local-ocr` asks for glm-ocr):
; PaddleOCR-VL-1.6-0.9B, Apache-2.0, 1.8 GB with its vision projector, the
; repo's only build. On the OCR benchmark (benchmarks/local_ocr, 2026-10-07)
; its OCR text held 300 of 303 printed rows to GLM-OCR's 256, but the product
; stored 278 with the printed value and 12 the page does not print, to
; GLM-OCR's 283 and none, which is why GLM-OCR stays the reader. Its prompts
; are "OCR:" and "Table Recognition:", so switching to it changes the
; `local-ocr` entry's `model` and `ocr_prompts` in config.llm.yaml, not only
; LOCAL_OCR_MODEL (docs/local-models.md, The document reader). Its tables come
; back in OTSL, which documents/ocr.py turns into HTML. The GGUF carries the
; repo's chat template.
[paddleocr-vl]
hf-repo = PaddlePaddle/PaddleOCR-VL-1.6-GGUF
c = 16384
cache-ram = 0

; The answering models: the setup page's two sizes, small first.

; Small, the default: MiniCPM5-2B, Apache-2.0, Q8_0, 2.7 GB. Text only: a
; photo reaches it as its OCR text. With GLM-OCR it runs on a 16 GB computer
; with no GPU. Q8_0 over Q4_K_M (1.6 GB): two runs each graded 229 and 225
; of 248 against 212 and 194, and on 4 vCPUs it reads a prompt faster (142
; against 94 tokens/s) and writes as fast (benchmarks/local_models, 2026-10-10).
[minicpm5-2b]
hf-repo = openbmb/MiniCPM5-2B-GGUF:Q8_0
c = 32768

; Large: Qwen3.8-27B quantized by ISTA-DASLab (GSQ-RCO, 3.5 bits), Apache-2.0,
; 13 GB, about 20 GB of memory with GLM-OCR: a 32 GB Mac or a 24 GB GPU. The tag
; brings the vision projector; hf-file picks the build that carries the
; multi-token-prediction head, which spec-type uses to write faster.
[qwen3.8-27b]
hf-repo = ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF:IQ3_S
hf-file = Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
c = 65536
spec-type = draft-mtp
