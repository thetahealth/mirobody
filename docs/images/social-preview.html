<!doctype html>
<!-- Source for docs/images/social-preview.png, the repository's social preview
     card (Settings -> General -> Social preview). Render at 1280x640 with a
     device scale factor of 2 and screenshot the page.

     It carries the README's own pitch: the headline, the two ways to run it,
     and a real frame of the product (frame 124 of docs/images/ask-own-demo.gif,
     saved as social-preview-frame.png). 317/317 is the README's gated score;
     nothing here is gated, so re-read it off the README before re-rendering. -->
<html><head><meta charset="utf-8"><title>Mirobody social preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:Inter,"Helvetica Neue",Arial,"PingFang SC",sans-serif;color:#e6edf3;
  background:radial-gradient(900px 520px at 100% 0%,rgba(35,92,171,.35),transparent 60%),
             radial-gradient(700px 480px at 0% 100%,rgba(105,68,154,.25),transparent 60%),#0d1117}
.page{position:relative;width:1280px;height:640px;padding:56px 64px}
.mark{font-size:22px;font-weight:700;letter-spacing:.32em;color:#9db8e8}
.left{position:absolute;left:64px;top:118px;width:560px}
h1{font-size:54px;line-height:1.08;letter-spacing:-.02em;font-weight:750;color:#fff}
h1 em{font-style:normal;color:#7aa7f0}
.sub{margin-top:22px;font-size:23px;line-height:1.45;color:#aab8c6}
.chips{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;gap:12px;font-size:20px;color:#dbe4ec;
  padding:10px 16px;border:1px solid rgba(255,255,255,.14);border-radius:12px;
  background:rgba(255,255,255,.04);width:max-content}
.chip code{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:18px;color:#7aa7f0}
.dot{width:10px;height:10px;border-radius:50%}
.foot{position:absolute;left:64px;bottom:44px;font-size:18px;color:#8598ab}
.foot b{color:#dbe4ec;font-weight:600}
.shot{position:absolute;right:-40px;top:96px;width:640px;border-radius:16px;overflow:hidden;
  border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.shot .bar{height:30px;background:#1b2330;display:flex;align-items:center;gap:7px;padding-left:14px}
.shot .bar i{width:11px;height:11px;border-radius:50%;background:#3a4556;display:block}
.shot img{display:block;width:100%}
</style></head><body><div class="page">
  <div class="mark">MIROBODY</div>

  <div class="left">
    <h1>Turn scattered health data into <em>answers you can trace.</em></h1>
    <div class="sub">Lab reports, wearables and genetic files in one <span style="white-space:nowrap">self-hosted</span> record.</div>
    <div class="chips">
      <div class="chip"><span class="dot" style="background:#7aa7f0"></span><code>./deploy.sh</code> + one model key</div>
      <div class="chip"><span class="dot" style="background:#6fcf97"></span>or every model local, on llama.cpp</div>
    </div>
  </div>

  <div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="social-preview-frame.png" alt=""></div>

  <div class="foot"><b>317/317</b> checkup-panel coverage &nbsp;·&nbsp; Apache-2.0 &nbsp;·&nbsp; <b>github.com/thetahealth/mirobody</b></div>
</div></body></html>
