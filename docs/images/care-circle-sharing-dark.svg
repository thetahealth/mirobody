<text x="650" y="236" font-size="24" fill="#EDF3F9" font-weight="650" text-anchor="start">Ask with permission</text>
<text x="650" y="271" font-size="19" fill="#B2C0CF" font-weight="400" text-anchor="start">Explore their health trends.</text>
