<svg xmlns="http://www.w3.org/2000/svg" width="920" height="636" viewBox="0 0 920 636" role="img" aria-labelledby="title description" font-family="&#x27;Inter&#x27;, &#x27;Helvetica Neue&#x27;, Arial, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif">
<title id="title">Care for family. Keep control.</title>
<desc id="description">Invite a family member and wait for acceptance. They choose whether to share their own record, with view or edit access. Ask about the shared record within that permission. Joining alone shares no health data. For a family member who does not sign in, you can manage a record until they take it over and choose your access.</desc>
<rect width="920" height="636" fill="#0D1117"/>
<text x="28" y="56" font-size="34" fill="#EDF3F9" font-weight="650" text-anchor="start">Care for family. Keep control.</text>
<text x="28" y="95" font-size="20" fill="#B2C0CF" font-weight="400" text-anchor="start">Separate records. Permission to share. Answers with sources.</text>
<rect x="24" y="132" width="268" height="320" rx="20" fill="#151E29" stroke="#344355" stroke-width="1.3"/>
<rect x="46" y="154" width="52" height="52" rx="15" fill="#1D3151"/>
