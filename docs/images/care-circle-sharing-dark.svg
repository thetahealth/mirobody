<text x="46" y="271" font-size="19" fill="#B2C0CF" font-weight="400" text-anchor="start">Send an invitation.</text>
<text x="46" y="297" font-size="19" fill="#B2C0CF" font-weight="400" text-anchor="start">They accept to join.</text>
