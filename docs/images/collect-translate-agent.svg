<svg xmlns="http://www.w3.org/2000/svg" width="920" height="412" viewBox="0 0 920 412" role="img" aria-labelledby="title description" font-family="'Inter', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title id="title">Collect, Translate, Agent: three stages, left to right</title>
<desc id="description">Collect brings in reports, wearables, genetics and journal entries. Translate matches names, normalizes units and keeps source links. Agent lets you see trends, compare reports and trace an answer back to the reading it came from. Parsing and answers use whichever model is configured; matching names and converting units runs locally.</desc>
<rect width="920" height="412" fill="#FFFFFF"/>
<rect x="24" y="30" width="268" height="306" rx="20" fill="#F7F9FC" stroke="#DCE4EC" stroke-width="1.3"/>
<rect x="46" y="52" width="36" height="36" rx="11" fill="#EAF1FD"/>
<g transform="translate(52 58) scale(1)" fill="none" stroke="#235CAB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l2 3h4l2-3h5"/><path d="M3 13 6 4h12l3 9"/><path d="M3 13v6h18v-6"/></g>
<text x="94" y="78" font-size="27" font-weight="700" fill="#182A3B" text-anchor="start">① Collect</text>
