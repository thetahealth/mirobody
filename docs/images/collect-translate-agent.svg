<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 446" width="1170" height="446" font-family='Helvetica, Arial, sans-serif' role="img" aria-label="Collect, Translate, Agent: three stages, left to right">
  <rect width="1170" height="446" fill="#ffffff"/>
  <defs>
    <marker id="raw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a8aa0"/>
    </marker>
    <marker id="std" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7d4a"/>
    </marker>
    <linearGradient id="grad-raw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#7a8aa0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7a8aa0"/>
    </linearGradient>
    <linearGradient id="grad-std" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#2f7d4a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2f7d4a"/>
    </linearGradient>
  </defs>
  <text x="585" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#22303f">Collect · Translate · Agent</text>
  <rect x="40" y="84" width="290" height="316" rx="14" fill="#f7f9fc" stroke="#9bb1c9" stroke-width="1.5"/>
  <text x="185" y="128" text-anchor="middle" font-size="21" font-weight="bold" fill="#22303f">① Collect</text>
