<rect x="348" y="52" width="36" height="36" rx="11" fill="#EAF5EF"/>
<g transform="translate(354 58) scale(1)" fill="none" stroke="#216547" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13M13 4l4 4-4 4"/><path d="M20 16H7M11 12l-4 4 4 4"/></g>
<text x="396" y="78" font-size="27" font-weight="700" fill="#182A3B" text-anchor="start">② Translate</text>
