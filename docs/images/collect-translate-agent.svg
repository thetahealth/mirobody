  <text x="470" y="200" text-anchor="start" font-size="13" font-weight="bold" fill="#9a6a1e">LOINC</text>
  <text x="700" y="200" text-anchor="end" font-size="10.5" font-weight="normal" fill="#9a6a1e">lab analytes</text>
  <rect x="458" y="220" width="254" height="30" rx="9" fill="#fff3e0" stroke="#c08a3e" stroke-width="1.1"/>
  <text x="470" y="240" text-anchor="start" font-size="13" font-weight="bold" fill="#9a6a1e">UCUM</text>
  <text x="700" y="240" text-anchor="end" font-size="10.5" font-weight="normal" fill="#9a6a1e">units</text>
  <rect x="458" y="260" width="254" height="30" rx="9" fill="#fff3e0" stroke="#c08a3e" stroke-width="1.1"/>
  <text x="470" y="280" text-anchor="start" font-size="13" font-weight="bold" fill="#9a6a1e">ICPC-3</text>
  <text x="700" y="280" text-anchor="end" font-size="10.5" font-weight="normal" fill="#9a6a1e">complaints</text>
  <rect x="458" y="300" width="254" height="30" rx="9" fill="#ffffff" stroke="#d8e1ec" stroke-width="1.1"/>
  <text x="470" y="320" text-anchor="start" font-size="11" font-weight="normal" fill="#77869a">refuses rather than guesses</text>
  <rect x="840" y="84" width="290" height="316" rx="14" fill="#f6edfa" stroke="#8a4fb0" stroke-width="2"/>
  <text x="985" y="128" text-anchor="middle" font-size="21" font-weight="bold" fill="#5e2e80">③ Agent</text>
  <text x="985" y="152" text-anchor="middle" font-size="12" font-weight="normal" fill="#5a6b7a">asks over the coded record</text>
  <rect x="858" y="180" width="254" height="30" rx="9" fill="#ffffff" stroke="#d8e1ec" stroke-width="1.1"/>
  <g transform="translate(867,186) scale(0.75)" fill="none" stroke="#8a4fb0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 3.5 3L20 7"/><path d="M15.5 7H20v4.5"/></g>
  <text x="890" y="200" text-anchor="start" font-size="11.5" font-weight="bold" fill="#31404f">Trend a value</text>
  <text x="1100" y="201" text-anchor="end" font-size="10" font-weight="normal" fill="#5a6b7a">minute … month</text>
  <rect x="858" y="220" width="254" height="30" rx="9" fill="#ffffff" stroke="#d8e1ec" stroke-width="1.1"/>
  <g transform="translate(867,226) scale(0.75)" fill="none" stroke="#8a4fb0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l7 3.5-7 3.5-7-3.5z"/><path d="M5 12l7 3.5 7-3.5"/></g>
  <text x="890" y="240" text-anchor="start" font-size="11.5" font-weight="bold" fill="#31404f">Compare labs</text>
  <text x="1100" y="241" text-anchor="end" font-size="10" font-weight="normal" fill="#5a6b7a">one code under them</text>
  <rect x="858" y="260" width="254" height="30" rx="9" fill="#ffffff" stroke="#d8e1ec" stroke-width="1.1"/>
  <g transform="translate(867,266) scale(0.75)" fill="none" stroke="#8a4fb0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h7l4 4v12H7z"/><path d="M14 4v4h4"/><path d="M10 14h5M10 17h3"/></g>
  <text x="890" y="280" text-anchor="start" font-size="11.5" font-weight="bold" fill="#31404f">Cite the file</text>
  <text x="1100" y="281" text-anchor="end" font-size="10" font-weight="normal" fill="#5a6b7a">behind every number</text>
  <rect x="858" y="300" width="254" height="30" rx="9" fill="#ffffff" stroke="#d8e1ec" stroke-width="1.1"/>
  <g transform="translate(867,306) scale(0.75)" fill="none" stroke="#8a4fb0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15v9h-8l-4 3.5v-3.5h-3z"/></g>
  <text x="890" y="320" text-anchor="start" font-size="11" font-weight="normal" fill="#77869a">/mcp  ·  gated per user</text>
  <path d="M342 242 H426" stroke="url(#grad-raw)" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#raw)"/>
  <text x="384.0" y="226" text-anchor="middle" font-size="10" font-weight="normal" fill="#5a6b7a">source kept</text>
  <path d="M742 242 H826" stroke="url(#grad-std)" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#std)"/>
  <text x="784.0" y="226" text-anchor="middle" font-size="10" font-weight="normal" fill="#5a6b7a">one coded record</text>
  <text x="585" y="422" text-anchor="middle" font-size="13.5" fill="#22303f">Whatever the lab called it, in — <tspan font-weight="bold" fill="#2f7d4a">one coded record an agent can cite, out.</tspan></text>
</svg>
