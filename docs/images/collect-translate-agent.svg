  <g transform="translate(198.0,186) scale(0.75)" fill="none" stroke="#4a5f74" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="6.5" width="10" height="11" rx="3"/><path d="M9.5 6.5V3.5h5v3M9.5 17.5v3h5v-3"/><path d="M12 10v2.2l1.5 1"/></g>
  <text x="221.0" y="200" text-anchor="start" font-size="10.5" font-weight="normal" fill="#31404f">Garmin</text>
  <rect x="58.0" y="220" width="123.0" height="30" rx="9" fill="#ffffff" stroke="#d8e1ec" stroke-width="1.1"/>
  <g transform="translate(67.0,226) scale(0.75)" fill="none" stroke="#4a5f74" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6.6"/><circle cx="12" cy="12" r="2.6"/></g>
  <text x="90.0" y="240" text-anchor="start" font-size="10.5" font-weight="normal" fill="#31404f">Oura</text>
  <rect x="189.0" y="220" width="123.0" height="30" rx="9" fill="#ffffff" stroke="#d8e1ec" stroke-width="1.1"/>
