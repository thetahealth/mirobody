<text x="78" y="224" font-size="18" font-weight="400" fill="#182A3B" text-anchor="start">Wearables &amp; exports</text>
<g transform="translate(46 249) scale(1)" fill="none" stroke="#526374" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4c0 5 8 5 8 8s-8 3-8 8"/><path d="M16 4c0 5-8 5-8 8s8 3 8 8"/><path d="M9.4 8.5h5.2M9.4 15.5h5.2"/></g>
