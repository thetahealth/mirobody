  <text x="90" y="280" text-anchor="start" font-size="11" font-weight="normal" fill="#31404f">Lab PDFs · phone photos · spreadsheets</text>
  <rect x="58" y="300" width="254" height="30" rx="9" fill="#ffffff" stroke="#d8e1ec" stroke-width="1.1"/>
  <g transform="translate(67,306) scale(0.75)" fill="none" stroke="#4a5f74" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4c0 5 8 5 8 8s-8 3-8 8"/><path d="M16 4c0 5-8 5-8 8s8 3 8 8"/><path d="M9.4 8.5h5.2M9.4 15.5h5.2"/></g>
  <text x="90" y="320" text-anchor="start" font-size="11" font-weight="normal" fill="#31404f">23andMe · AncestryDNA · WeGene · VCF</text>
  <rect x="58" y="340" width="254" height="30" rx="9" fill="#ffffff" stroke="#d8e1ec" stroke-width="1.1"/>
  <g transform="translate(67,346) scale(0.75)" fill="none" stroke="#4a5f74" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15v9h-8l-4 3.5v-3.5h-3z"/></g>
  <text x="90" y="360" text-anchor="start" font-size="11" font-weight="normal" fill="#31404f">a sentence you type</text>
