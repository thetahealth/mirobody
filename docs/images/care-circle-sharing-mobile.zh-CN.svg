<text x="42" y="273" font-size="24" fill="#182A3B" font-weight="650" text-anchor="start">邀请家人</text>
<text x="42" y="308" font-size="19" fill="#526374" font-weight="400" text-anchor="start">发送邀请，</text>
<text x="42" y="334" font-size="19" fill="#526374" font-weight="400" text-anchor="start">对方接受后加入关爱圈。</text>
