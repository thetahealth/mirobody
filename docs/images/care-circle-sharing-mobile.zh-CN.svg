<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1420" viewBox="0 0 390 1420" role="img" aria-labelledby="title description" font-family="&#x27;Inter&#x27;, &#x27;Helvetica Neue&#x27;, Arial, &#x27;PingFang SC&#x27;, &#x27;Microsoft YaHei&#x27;, sans-serif">
<title id="title">关爱家人，也尊重每个人的选择</title>
<desc id="description">邀请家人，对方接受后加入关爱圈。家人决定是否共享自己的档案，以及允许查看还是编辑。你只能在获准范围内查询家人的记录，回答保留来源。加入关爱圈不会自动共享健康数据。不自行登录的家人可先由你代管档案；本人接管后重新选择你的权限。</desc>
<rect width="390" height="1420" fill="#FFFFFF"/>
<text x="20" y="44" font-size="28" fill="#182A3B" font-weight="650" text-anchor="start">关爱家人，</text>
<text x="20" y="81" font-size="28" fill="#182A3B" font-weight="650" text-anchor="start">也尊重每个人的选择</text>
<text x="20" y="115" font-size="18" fill="#526374" font-weight="400" text-anchor="start">独立的健康档案 · 本人决定共享</text>
<text x="20" y="141" font-size="18" fill="#526374" font-weight="400" text-anchor="start">回答有据可查</text>
<rect x="20" y="169" width="350" height="320" rx="20" fill="#F7F9FC" stroke="#DCE4EC" stroke-width="1.3"/>
