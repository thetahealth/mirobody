<text x="346" y="571" font-size="20" fill="#216547" font-weight="650" text-anchor="end">02</text>
<text x="42" y="619" font-size="24" fill="#182A3B" font-weight="650" text-anchor="start">本人决定共享权限</text>
<text x="42" y="654" font-size="19" fill="#526374" font-weight="400" text-anchor="start">自己的记录，自己做主。</text>
