<text x="42" y="1000" font-size="19" fill="#526374" font-weight="400" text-anchor="start">了解家人的健康变化。</text>
<rect x="40" y="1032" width="310" height="96" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.3"/>
<g transform="translate(50 1043) scale(0.8928571428571429)" fill="none" stroke="#69449A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l6 6v16H7ZM17 3v7h6M11 15h8M11 20h6"/></g>
