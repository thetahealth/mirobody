[[tool.importlinter.contracts]]
name = "engine does not import the agent layer"
type = "forbidden"
source_modules = [
    # The LIBRARY — what `pip install mirobody` ships and a consumer imports.
    "mirobody._bundle",
    "mirobody._strtab",
    "mirobody.engine",
    "mirobody.lexical",
