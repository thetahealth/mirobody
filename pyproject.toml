[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirobody"
dynamic = ["version"]
authors = [
    {name = "Theta AI Team", email = "developer@thetahealth.ai"},
]
description = "Self-hosted data platform that bridges your personal data with the latest AI capabilities."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["health", "wellness", "data processing", "AI", "LLM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Configuration.
    "setuptools",
    "python-dotenv",
    "ruamel.yaml<0.18.0",
    "cryptography",
    # Data.
    "redis",
    "psycopg[binary]",
    "psycopg[pool]",
    "sqlalchemy",
    "greenlet",  # required by SQLAlchemy's async engine (greenlet_spawn)
    "pandas",
    # HTTP.
    "aiohttp",
    "starlette",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyjwt",
    "pytz",
    "webauthn>=2.0.0",
    # Storage.
    "aioboto3",
    # File.
    "pypdf>=5.1.0",
    "pypdfium2>=4.30.0",
    "pdfplumber~=0.11.7",
    "cachetools~=6.2.4",
    "Pillow>=11.1.0,<12.0.0",
    "tinytag>=1.6.0",
    "mutagen~=1.47.0",
    "rarfile~=4.0",
    "py7zr~=0.22.0",
    "openpyxl~=3.1.5",
    # Email.
    "mandrill",
    # LLM.
    "azure-identity>=1.15.0",
    "openai>=2.11.0",
    "openai-agents==0.7.0",
    # Floor at 2.0: the Interactions API server dropped the legacy turn-list
    # schema (breaking change, May 2026) and now requires the 2.x 'steps' schema,
    # which only the >=2.0 SDK can send/parse. No upper cap.
    "google-genai>=2.0.0",
    "langchain",
    "langchain-openai",
    "langchain-anthropic",
    # 4.2.4 relaxed its google-genai cap to <3.0.0 (earlier 4.x pinned <2.0.0,
    # which would block the google-genai>=2.0 required above).
    "langchain-google-genai>=4.2.4",
    "langchain-google-vertexai",
    # Pulled transitively by langchain-google-vertexai (which only floors >=1.97);
    # 1.157 relaxed its google-genai cap to <3.0.0 — older ones pin <2.0.0 and
    # would conflict with google-genai>=2.0 above.
    "google-cloud-aiplatform>=1.157.0",
    "langchain_community",
    # deepagents 0.6.7+ for the modern BackendProtocol surface (Result dataclasses).
    "deepagents>=0.6.7",
    # In-process JS/TS interpreter middleware (replaces the E2B remote sandbox).
    "langchain-quickjs>=0.1.3",
    "jinja2",
    # Legacy.
    "aiofiles~=24.1.0",
    "pycryptodome>=3.20.0",
    "requests-oauthlib",
    "tiktoken>=0.9.0",
    "defusedxml",
]

[project.optional-dependencies]
cn = ["oss2", "volcengine-python-sdk[ark]~=3.0.1", "dashscope"]
fin = ["yfinance"]
test = ["pytest", "pytest-asyncio", "pytest-sugar"]

[project.urls]
"Homepage" = "https://github.com/thetahealth/mirobody"
"Bug Reports" = "https://github.com/thetahealth/mirobody/issues"
"Source" = "https://github.com/thetahealth/mirobody"

[tool.setuptools.packages.find]
include = ["mirobody", "mirobody.*"]

[tool.setuptools.package-data]
"mirobody" = [
    "**/*.md",
    "**/*.sql",
    "**/*.json",
    "**/*.yaml",
    "**/*.jinja",
    "**/*.so",
    "**/*.bin",
    "**/*.html",
    "**/*.htm",
    "**/*.js",
    "**/*.css",
    "**/*.png",
    "**/*.jpg",
    "**/*.jpeg",
    "**/*.svg",
    "**/*.ico",
]
"mirobody.pub.htdoc.__.auth" = ["handler", "iframe"]

[tool.setuptools.dynamic]
version = {attr = "mirobody.__version__"}

[tool.pytest.ini_options]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
