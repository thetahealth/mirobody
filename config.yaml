  demo2@mirobody.ai: '777777'
  demo3@mirobody.ai: '777777'

#-----------------------------------------------------------------------------
# OAuth.

# JWT secret key used for HS256 algorithm.
JWT_KEY: REPLACE_THIS_VALUE_IN_PRODUCTION

# JWT issuer.
JWT_ISS: mirobody
# JWT audience.
JWT_AUD: mirobody_aud
# JWT client ID.
JWT_CLIENT_ID: mirobody_data
# JWT scope.
JWT_SCOPE: "mcp:read mcp:write"

# JWT private key used for RS256 algorithm.
# JWT_PRIVATE_KEY: 'REPLACE_THIS_VALUE_IN_PRODUCTION'

#-----------------------------------------------------------------------------

# GOOGLE_CLIENT_ID: ''
# FIREBASE_PROJECT_ID: ''

# APPLE_TEAM_ID: ''
# APPLE_KEY_ID: ''
# APPLE_PRIVATE_KEY: ''

# Apple OAuth client IDs for JWT token generation.
# APPLE_CLIENT_ID: ''
# APPLE_CLIENT_ID_APP: ''

# Apple authorization code client ID.
#   Can be omitted if the two client IDs above are identical.
# APPLE_AUTH_CLIENT_ID: ''

# Web frontend configuration.
#   These settings are injected into the frontend at build/runtime.
#
# Feature toggles:
#   __IS_API_CONFIG_ON__: Enable API configuration panel in settings.
#   __IS_QR_LOGIN_ON__: Enable QR code login feature.
#   __IS_GOOGLE_LOGIN_ON__: Enable Google OAuth login.
#   __IS_APPLE_LOGIN_ON__: Enable Apple Sign-In.
#   __IS_NEW_FEATURES_ON__: List of new features to enable (e.g., MCP).
#   __IS_MOBILE_SOURCE_ON__: Enable mobile data source integration.
#
# Firebase configuration (for authentication and analytics):
#   Obtain these values from Firebase Console -> Project Settings.
#
# MIROBODY_WEB_CONFIG:
#   __IS_API_CONFIG_ON__: true
#   __IS_QR_LOGIN_ON__: false
#   __IS_GOOGLE_LOGIN_ON__: true
#   __IS_APPLE_LOGIN_ON__: true
#   __IS_NEW_FEATURES_ON__:
#     - MCP
#   __IS_MOBILE_SOURCE_ON__: true
#   __FIREBASE_API_KEY__: ""
#   __FIREBASE_AUTH_DOMAIN__: ""
#   __FIREBASE_PROJECT_ID__: ""
#   __FIREBASE_STORAGE_BUCKET__: ""
#   __FIREBASE_MESSAGING_SENDER_ID__: ""
#   __FIREBASE_APP_ID__: ""
#   __FIREBASE_MEASUREMENT_ID__: ""

#-----------------------------------------------------------------------------
# LLM Configuration.

MCP_TOOL_DIRS:
  - mirobody/pub/tools
  - mirobody/pub/tools_health
MCP_RESOURCE_DIRS:
  - mirobody/pub/resources
  - resources
AGENT_DIRS:
  - mirobody/pub/agents
  - agents
PROVIDER_DIRS:
  - mirobody/pulse/theta
  - providers
SKILL_DIRS:
  - mirobody/pub/skills
  - skills

# LLM provider API keys. Get one (or more) from the provider you intend to use:
#   GOOGLE_API_KEY     -> https://aistudio.google.com/apikey
#   OPENAI_API_KEY     -> https://platform.openai.com/api-keys
#   OPENROUTER_API_KEY -> https://openrouter.ai/keys   (one key, many models)
GOOGLE_API_KEY: ""
OPENAI_API_KEY: ""
OPENROUTER_API_KEY: ""

# DashScope (OpenAI-compatible) API key. Set this to use DashScope-hosted models
# as LLM / embedding / vision providers via the OpenAI-compatible endpoint
# (https://dashscope.aliyuncs.com/compatible-mode/v1). See the commented
# `dashscope` example under PROVIDERS_DEEP below for the provider shape.
#   Get a key -> https://dashscope.console.aliyun.com/apiKey
DASHSCOPE_API_KEY: ""

#---------------------------------------------------------

ALLOWED_TOOLS_DEEP:

DISALLOWED_TOOLS_DEEP:

PROMPTS_DEEP:
  - pub/prompts/deep/theta_health.jinja
  - pub/prompts/deep/theta_health_simple.jinja

PROVIDERS_DEEP:
  gemini-3.5-flash:
    llm_type: google-genai
    api_key: GOOGLE_API_KEY
    model: gemini-3.5-flash
    temperature: 1.0
  gpt-5.4:
    llm_type: openai
    api_key: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-5.4
    temperature: 0.1
  claude-sonnet:
    llm_type: openai
    api_key: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    model: anthropic/claude-sonnet-4.6
    temperature: 0.1
  deepseek:
    llm_type: openai # Uses OpenAI-compatible API via OpenRouter
    api_key: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4-flash
    temperature: 0.1
  # Example: a DashScope-hosted model via its OpenAI-compatible endpoint.
  # Uncomment and set DASHSCOPE_API_KEY above to enable.
  # dashscope:
  #   llm_type: openai
  #   api_key: DASHSCOPE_API_KEY
  #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   model: qwen-plus
  #   temperature: 0.1

#---------------------------------------------------------

ALLOWED_TOOLS_RTC:

DISALLOWED_TOOLS_RTC:

PROMPTS_RTC:

#---------------------------------------------------------

ALLOWED_TOOLS_MIX:

DISALLOWED_TOOLS_MIX:

# Phase 1 (Orchestrator): Tool orchestration and data collection prompts (internal use)
PROMPTS_MIX:
  - pub/prompts/mix/orchestrator.jinja@orchestrator
  - pub/prompts/mix/responder.jinja@responder


PROVIDERS_MIX:
  # Phase 1 (Orchestrator): Tool orchestration and data collection
  claude&gemini:
    claude-sonnet@orchestrator:
      llm_type: openai
      api_key: OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
      model: anthropic/claude-sonnet-4.6
      temperature: 0.1
    # Phase 2 (Responder): same model whether or not Phase 1 used tools.
    # Omitting response_with_tools makes this a flexible responder used for
    # both cases (see mix/mixin.py _get_responder selection logic).
    gemini-3.5-flash@responder:
      llm_type: google-genai
      api_key: GOOGLE_API_KEY
      model: gemini-3.5-flash
      temperature: 1.0
      include_thoughts: true
      thinking_level: medium
#---------------------------------------------------------

PROVIDERS_BASE:
  gemini-2.5-flash:
    api_key: GOOGLE_API_KEY
    model: gemini-2.5-flash
    input_price: 0.5
    output_price: 2.0
  gpt-5-nano:
    api_key: OPENAI_API_KEY
    model: gpt-5-nano
    input_price: 0.05
    output_price: 0.4
  miro-thinker:
    api_key: MIROTHINKER_API_KEY
    model: mirothinker-1-7-deepresearch

ALLOWED_TOOLS_BASE:

DISALLOWED_TOOLS_BASE:

PROMPTS_BASE:

