# HTTP Server Configuration.

HTTP_SERVER_NAME: mirobody

# HTTP_HOST: 0.0.0.0
# HTTP_PORT: 80

# HTTP_URI_PREFIX: ''
HTTP_ROOT: frontend

# HTTP_HEADERS:
#   Access-Control-Allow-Origin: 'http://localhost:18080'  # CHANGE FOR PRODUCTION
#   Access-Control-Allow-Credentials: 'true'
#   Access-Control-Allow-Methods: 'GET, POST, PUT, DELETE, OPTIONS'
#   Access-Control-Allow-Headers: 'Authorization, Content-Type'
#   Access-Control-Max-Age: '600'

# MCP_FRONTEND_URL: ''
# MCP_PUBLIC_URL: ''
# DATA_PUBLIC_URL: ''
# QR_LOGIN_URL: ''

# {url_path: requests_per_minute}
# Pre-auth endpoints are counted per client IP (there is no user yet); the
# rest per user. /password/login and /email/verify are the online-guessing
# surfaces — without an entry here, bcrypt cost is the only friction on a
# password-guessing loop.
REQUEST_RATE_LIMITER:
  /api/chat: 6
  /api/session: 6
  /password/login: 10
  /password/register: 5
  /email/login: 5
  /email/verify: 10

# [url_path]
