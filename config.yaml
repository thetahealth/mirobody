# loaded by SEED_DEMO_DATA). `exp1/exp2/exp3` said nothing about that.
#
# This is the email-CODE path, which needs no mail provider precisely because the
# code is listed here. It is a demo credential in a public repository — treat it
# as public. For an account of your own use `POST /password/register`, which
# stores a bcrypt hash and ships no default.
EMAIL_PREDEFINE_CODES:
