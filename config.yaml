# !IMPORTANT!
#   DO NOT EDIT THIS FILE, AS DEFAULT SETTINGS ARE DEFINED HERE.
#   PUT YOUR OWN CUSTOMIZATIONS IN A 'config.{your_env}.yaml' OVERLAY
#     ('./deploy.sh' GENERATES ONE FOR YOU AND POINTS ENV AT IT).

#-----------------------------------------------------------------------------
# Logging Configuration.
#
# By default, logs go to console only (stdout).
# To enable file logging, set LOG_NAME and LOG_DIR in your config.{env}.yaml:
#   LOG_NAME: mirobody
#   LOG_DIR: ./logs
# Log files are created as {date}_{name}_{time}.log in LOG_DIR.

# LOG_NAME: ''
# LOG_DIR: ''

# Log level (case insensitive):
#   'debug', 'info', 'warning', 'error', or 'critical/fatal'.
# INFO by default: DEBUG-level lines include request/response details that a
# health-data deployment should not accumulate on disk unless someone is
# actively debugging. Raise to DEBUG per-environment, not here.
LOG_LEVEL: INFO

#-----------------------------------------------------------------------------
# Deployment posture.
#
# Two explicit switches — NOT environment names. `ENV` only selects which
# config.{ENV}.yaml overlay loads and tags log lines; call it anything.
# (An earlier version keyed these behaviors on a hardcoded name list, so
# `ENV=production` silently got the demo posture. Names carry no behavior now.)

# Replay mirobody/schema/*.sql at every boot. Right for the one-command demo
# (tables appear by themselves); real deployments provision the schema ahead
# of time and set this to false in their overlay.
BOOTSTRAP_SCHEMA: true

# Declare that this deployment faces real users. When true, the server
# REFUSES to start while any demo affordance remains:
#   - EMAIL_PREDEFINE_CODES non-empty (hardcoded login codes = anonymous login)
#   - any value still reading REPLACE_THIS_VALUE_IN_PRODUCTION
# and SEED_DEMO_DATA is ignored (synthetic patients never seed).
# Setting this is the FIRST item of SECURITY.md's pre-exposure checklist.
PRODUCTION: false

#-----------------------------------------------------------------------------
# Timezone Configuration.

# Default timezone for users who haven't set their timezone.
# Examples: "Asia/Shanghai", "America/New_York", "Europe/London", "UTC"
DEFAULT_TIMEZONE: America/Los_Angeles

