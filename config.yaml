#-----------------------------------------------------------------------------
# File Processing Configuration.

# Enable or disable health indicator extraction from uploaded files.
#   0 = disabled (skip extraction)
#   1 = enabled (extract indicators)
ENABLE_INDICATOR_EXTRACTION: 1

# Optional fhir_id mapping on th_series_data writes: with _R the writer looks
# each indicator up in the fhir_indicators table so rows carry a stable
# fhir_id; with _W it also auto-registers indicators the table is missing.
# Off by default — readings write fine without either.
# FHIR_TABLE_AUTO_R: true
# FHIR_TABLE_AUTO_W: true
# Embedding provider, for BOTH the fhir_indicators and th_series_dim vector
# columns — there is one knob, not two. (A second key, DIM_EMBEDDING_PROVIDER,
# was documented here and read by no code at all; removed.)
#
# UNSET BY DEFAULT: when this key is absent the provider follows whichever
# API key exists (openrouter → qwen/DashScope → gemini; vision auto-selects
# by key too, in its own order — gemini → openrouter → qwen), so
# either one-key path gets embeddings with no
# extra line. Set it explicitly to pin one.
#
#   openrouter  OPENROUTER_API_KEY  qwen/qwen3-embedding-8b, columns
#               embedding_qwen3_8b. Open weights: a deployment can self-host
#               the SAME model (e.g. vLLM/TEI serving Qwen3-Embedding-8B with
#               an OpenAI-compatible /v1/embeddings) and set
#               OPENROUTER_BASE_URL to it (any `<PROVIDER>_BASE_URL` key
#               redirects its OpenAI-compatible provider) — corpus and queries
#               stay in one
#               vector space as long as ONE serving does both. If that serving
#               publishes the model under a different id, name it with
#               OPENROUTER_EMBEDDING_MODEL (`<PROVIDER>_EMBEDDING_MODEL`);
#               scripts/build_loinc_embeddings.py reads the same two keys, so
#               the matrix it builds and the queries agree by construction —
#               and disagree LOUDLY if you change one without rebuilding.
#               (OpenRouter serves the 8B and 4B sizes; 0.6B returned 404 "No
#               endpoints found" when checked on 2026-08-23.)
#   qwen        DASHSCOPE_API_KEY   text-embedding-v4 (the productized
#               Qwen3-Embedding; batch cap 10, dimensions: 1024), columns
#               embedding_qwen3 / embedding_qwen. The DashScope fallback path.
#   gemini      GOOGLE_API_KEY      gemini-embedding-001, columns
#               embedding_gemini.
#
# Vectors are only comparable within ONE (provider, model) pair: corpus and
# query MUST be embedded by the same model, and a mismatched pair does not
# error — it returns confident nonsense. That is also why each provider gets
# its own database columns, and why SWITCHING providers (or models) on an
# existing deployment means re-embedding: run
# `python -m mirobody.indicator embed` so the new columns fill; searches
# degrade visibly (empty column → lexical fallback) rather than silently
# mis-rank in the meantime.
# EMBEDDING_PROVIDER: ''

# Vision model for image/PDF parsing (unified_file_extract). The vision provider
# auto-selects 'gemini' when GOOGLE_API_KEY is set; this overrides its default
# (gemini-3.8-flash). Key name = <PROVIDER>_VISION_MODEL, provider='gemini'.
GEMINI_VISION_MODEL: gemini-3.5-flash
