#   __FIREBASE_MEASUREMENT_ID__: ""

#-----------------------------------------------------------------------------
# LLM Configuration.

# How long a personal MCP URL stays valid, in days (default 30).
#
# `POST /personal/mcp` mints `{origin}/mcp/{secret}`, and that secret is the
# WHOLE credential — `/mcp/{secret}` needs no JWT and grants read access to
# that person's health record. It is a bearer token carried in a URL, so it
# ends up in desktop-client config files, screenshots and shell history. This
# was a hardcoded 365 days with no way to revoke; `DELETE /personal/mcp`
# revokes one now, and the next mint issues a fresh secret.
MCP_URL_TTL_DAYS: 30

MCP_TOOL_DIRS:
  - mirobody/agent/tools
AGENT_DIRS:
  - mirobody/agent
PROVIDER_DIRS:
  - mirobody/pulse/providers

# Agent Skills (https://agentskills.io/) — directories of SKILL.md skill
# packages, served to the agent via deepagents' native SkillsMiddleware: the
# first entry that exists is mounted read-only at /skills/ in the agent's
# virtual filesystem, and skills load with progressive disclosure (frontmatter
# at startup, full body only when the task needs it). Put deployment-specific
# skills in your own directory and list it first.
SKILL_DIRS:
  - mirobody/agent/skills

# LLM provider API keys.
#
# ONE KEY IS ENOUGH — zero further configuration:
#
#   Recommended: OPENROUTER_API_KEY  (https://openrouter.ai/keys)
#   Fallback:    DASHSCOPE_API_KEY   (https://dashscope.console.aliyun.com/apiKey)
#                for networks where openrouter.ai is unreachable
#                (mainland China being the common case)
#
# Whichever single key is present, chat, vision/file parsing AND embeddings
# all follow it automatically: the chat default picks claude-sonnet (via
# OpenRouter) or qwen (via DashScope) by which key exists; vision auto-selects
# the same way; EMBEDDING_PROVIDER, when unset, resolves openrouter →
# qwen(DashScope) → gemini by key. That is the point of a gateway: one key,
# many models (DashScope also hosts DeepSeek/Kimi/GLM — see the
# `# —— DashScope fallback ——` block under PROVIDERS; every model id
# there was verified against the live endpoint on 2026-08-23). The other keys
# below are for deployments that prefer a direct provider.
#   OPENROUTER_API_KEY -> https://openrouter.ai/keys   (one key, many models)
#   GOOGLE_API_KEY     -> https://aistudio.google.com/apikey
#   OPENAI_API_KEY     -> https://platform.openai.com/api-keys
GOOGLE_API_KEY: ""
OPENAI_API_KEY: ""
OPENROUTER_API_KEY: ""

# Any OpenAI-compatible provider can be redirected to a self-hosted or proxy
# endpoint with `<PROVIDER>_BASE_URL` (OPENROUTER_BASE_URL, DASHSCOPE_BASE_URL,
# OPENAI_BASE_URL, …) — chat, vision/file parsing, structured extraction and
# embeddings all follow it. If the endpoint does not serve the default model
# ids, pick the models with `<PROVIDER>_MODEL` (chat/structured extraction),
# `<PROVIDER>_VISION_MODEL` (image/PDF parsing) and `<PROVIDER>_EMBEDDING_MODEL`
# (embeddings — see the EMBEDDING_PROVIDER block below, changing it means
# re-embedding). Example — everything
# through DashScope while keeping the OpenRouter-style one-key setup:
#   OPENROUTER_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
#   OPENROUTER_MODEL: qwen-flash
#   OPENROUTER_VISION_MODEL: qwen3-vl-flash
# The endpoint must tolerate the provider's request dialect (extra_body flags
# such as OpenRouter's `reasoning`); gateways like LiteLLM/one-api do.

# DashScope (OpenAI-compatible) API key — the fallback one-key path for
# networks where openrouter.ai is unreachable (mainland China being the
# common case). Covers chat (Qwen/DeepSeek/Kimi/GLM), vision (qwen3-vl,
# auto-selected when this is the only key present) and embeddings
# (EMBEDDING_PROVIDER: qwen) via
# https://dashscope.aliyuncs.com/compatible-mode/v1. See the
# `# —— DashScope fallback ——` block under PROVIDERS below.
#   Get a key -> https://dashscope.console.aliyun.com/apiKey
DASHSCOPE_API_KEY: ""

# DeepSeek API key — for a direct DeepSeek endpoint (`LLMProvider.DEEPSEEK` in
# utils/config/llm.py). Chat via OpenRouter's `deepseek` entry above needs no
# separate key.
#   Get a key -> https://platform.deepseek.com
DEEPSEEK_API_KEY: ""

#---------------------------------------------------------
# Agent conversation memory.
#
# The agent's graph is compiled with a LangGraph Postgres checkpointer keyed on
# thread_id = session_id, so LangGraph stores the real message objects and
# replays the conversation itself — the caller passes only the new turn.
# The four checkpoint_* tables are created by the saver's own setup() on first
# use, in PG_SCHEMA; no migration file is needed.
#
# Set to false to run the agent with no cross-turn memory (each turn starts
# fresh). Useful if the agent's DB role may not create tables, or to stage the
# rollout. Failure to reach the database degrades to the same behaviour rather
# than failing the request.
AGENT_CHECKPOINTER: true

#---------------------------------------------------------

# The agent's own settings. One agent, so the keys carry no agent-name suffix
# (they were PROVIDERS_DEEP / PROMPTS_DEEP / ... before 1.4.0). An overlay that
# still uses the old spelling keeps working — each `*_DEEP` key is read as its
# current name and the log says so once — but rename them: the alias is a
# migration courtesy, not the contract.
#
# ALLOWED_TOOLS  — whitelist: the agent may use ONLY these MCP tools.
# DISALLOWED_TOOLS — blacklist: everything except these. Whitelist wins when both
#                    are set. `eval` here turns off the in-process REPL.
# PROMPTS        — system prompt templates (path, or path@name); the first is
#                  the default. Package-relative paths work from a pip install.
# PROVIDERS      — the model picker: one entry per LLM client, `api_key` naming
#                  the config/env key that holds the secret.
# AGENT_NAME     — the persona name the prompt addresses the model by.

ALLOWED_TOOLS:

DISALLOWED_TOOLS:

PROMPTS:
  - agent/prompts/mirobody.jinja

PROVIDERS:
  gemini-flash:
    llm_type: google-genai
    api_key: GOOGLE_API_KEY
    model: gemini-3.5-flash
    temperature: 1.0
  gpt:
    llm_type: openai
    api_key: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-5.4-mini
    temperature: 0.1
  claude-sonnet:
    llm_type: openai
    api_key: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    model: anthropic/claude-sonnet-5
    temperature: 0.1
  deepseek:
    llm_type: openai # Uses OpenAI-compatible API via OpenRouter
    api_key: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4-flash-0731
    temperature: 0.1
  # —— DashScope fallback —— The alternative one-key path, through DashScope
  # instead of OpenRouter, for networks where openrouter.ai is unreachable
  # (mainland China being the common case). `qwen` is
  # ACTIVE and is the automatic chat default when DASHSCOPE_API_KEY is the key
  # present — a bare key is enough, no overlay lines needed. Vision and
  # embeddings follow the key automatically too (qwen3-vl-flash;
  # text-embedding-v4). Model ids verified against the live endpoint
  # 2026-08-23. qwen3.5-flash rather than qwen-plus/qwen-flash: the latter two
  # hit DashScope's legacy backend that rejects function results. DashScope also hosts DeepSeek and Kimi —
  # uncomment to offer them in the model picker.
  qwen:
    llm_type: openai
    api_key: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen3.5-flash
    temperature: 0.1
  # deepseek-cn:
  #   llm_type: openai
  #   api_key: DASHSCOPE_API_KEY
  #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   model: deepseek-v3.2
  #   temperature: 0.1
  # kimi:
  #   llm_type: openai
  #   api_key: DASHSCOPE_API_KEY
  #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   model: kimi-k2.5
  #   temperature: 0.1


