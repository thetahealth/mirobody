# !IMPORTANT!
#   DO NOT EDIT THIS FILE, AS DEFAULT SETTINGS ARE DEFINED HERE.
#   AND A 'config.{your_env}.yaml' FILE SHOULD BE CREATED AUTOMATICALLY
#     BY THE 'run.sh' SCRIPT FOR YOUR OWN CUSTOMIZATIONS.

#-----------------------------------------------------------------------------
# Logging Configuration.
#
# By default, logs go to console only (stdout).
# To enable file logging, set LOG_NAME and LOG_DIR in your config.{env}.yaml:
#   LOG_NAME: mirobody
#   LOG_DIR: ./logs
# Log files are created as {date}_{name}_{time}.log in LOG_DIR.

# LOG_NAME: ''
# LOG_DIR: ''

# Log level (case insensitive):
#   'debug', 'info', 'warning', 'error', or 'critical/fatal'.
LOG_LEVEL: DEBUG

#-----------------------------------------------------------------------------
# Timezone Configuration.

# Default timezone for users who haven't set their timezone.
# Examples: "Asia/Shanghai", "America/New_York", "Europe/London", "UTC"
DEFAULT_TIMEZONE: America/Los_Angeles

#-----------------------------------------------------------------------------
# HTTP Server Configuration.

HTTP_SERVER_NAME: mirobody

# HTTP_HOST: 0.0.0.0
# HTTP_PORT: 80

# HTTP_URI_PREFIX: ''
HTTP_ROOT: mirobody/pub/htdoc

# HTTP_HEADERS:
#   Access-Control-Allow-Origin: '*'
#   Access-Control-Allow-Credentials: 'true'
#   Access-Control-Allow-Methods: '*'
#   Access-Control-Allow-Headers: '*'
#   Access-Control-Max-Age: '86400'

# MCP_FRONTEND_URL: ''
# MCP_PUBLIC_URL: ''
# DATA_PUBLIC_URL: ''
# QR_LOGIN_URL: ''

# {url_path: requests_per_minute}
REQUEST_RATE_LIMITER:
  /api/chat: 6
  /api/session: 6

# [url_path]
# USER_INFO_UPDATER:

#-----------------------------------------------------------------------------
# Redis Configuration.

REDIS_HOST: 10.108.0.9
REDIS_PORT: 6379
REDIS_DB: 0
REDIS_PASSWORD: REPLACE_THIS_VALUE_IN_PRODUCTION
REDIS_SSL: false
REDIS_SSL_CHECK_HOSTNAME: false
REDIS_SSL_CERT_REQS: none

