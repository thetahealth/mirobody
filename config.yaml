#-----------------------------------------------------------------------------
# Optional API Keys for Extended Functionality.


# DashScope API Key (OPTIONAL)
# Used for Alibaba Cloud DashScope service (audio transcription).
# Leave empty if not using ASR (Automatic Speech Recognition) features.
# DASHSCOPE_API_KEY: ''

# Anthropic Claude API Key (OPTIONAL)
# Required only if using Claude as your LLM provider.
# ANTHROPIC_API_KEY: ''

# Jina API Key (OPTIONAL)
# JINA_API_KEY: ''

# Embedding provider for th_series_dim vector recall column.
# Supported: gemini, qwen. Default: gemini
# DIM_EMBEDDING_PROVIDER: gemini

# File analysis LLM provider override (optional).
# Leave empty for auto-selection based on available API keys.
# Supported: openai, volcengine, gemini, openrouter, dashscope, doubao-lite
# Default(no config): auto-select (priority: openai > openrouter > gemini > volcengine > dashscope)
# FILE_ANALYSIS_PROVIDER: ''

#-----------------------------------------------------------------------------
# File Processing Configuration.

# Enable or disable health indicator extraction from uploaded files.
#   0 = disabled (skip extraction)
#   1 = enabled (extract indicators)
ENABLE_INDICATOR_EXTRACTION: 1
EMBEDDING_PROVIDER: gemini

# Vision model for image/PDF parsing (unified_file_extract). The vision provider
# auto-selects 'gemini' when GOOGLE_API_KEY is set; this overrides its default
# (gemini-3-flash-preview). Key name = <PROVIDER>_VISION_MODEL, provider='gemini'.
GEMINI_VISION_MODEL: gemini-3.5-flash
