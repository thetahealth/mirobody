name: Test Build

# The comment here used to say "or on push" while no push trigger existed, so
# every commit landing on main went unchecked and had to be dispatched by hand.
#
# No paths filter, deliberately. The old one listed '**.py', pyproject.toml and
# this file, which already missed config.yaml (the demo credential test reads
# it) and now misses README*.md, mirobody/demo/ and mirobody/res/ as well --
# test_readme_numbers.py checks the READMEs' figures against the bundle and the
# fixture, so a README-only edit can break the build. A filter that is wrong is
# worse than no filter, and a full run is three minutes.
on:
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Test version number (e.g., 1.0.0a1, 1.0.0b1, 1.0.0rc1)'
        required: false
        default: '0.0.0a1'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    # lfs: true is load-bearing here for the same reason it is in
    # pypi-release.yml, and this job was missing it. A plain checkout leaves
    # 133-byte pointer files where mirobody/res/*.gz lives, so:
    #   * the engine tests fail with `BadGzipFile: Not a gzipped file (b've')`
    #     — that `ve` is the start of `version https://git-lfs...`
    #   * `python -m build` below happily packages the pointers, which is
    #     exactly how 1.0.62 shipped a wheel whose `resolve` could never work
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools wheel

    # The suite and the layering contract, actually run.
    #
    # `pytest` was in the install line above and was never invoked, so every
    # claim the tests carry — the 176/176 resolver number, the vendor payload
    # snapshots, the security regressions — was unguarded on every PR. An
    # external reviewer found a `[test]`-only install aborting at collection;
    # a CI run would have caught it the day it appeared.
    #
    # `[test]` alone here on purpose, NOT `[agents,test]`: this job is the
    # closest thing to a fresh contributor's machine, and it is where a missing
    # or newly-eager dependency shows up. The full run happens below.
    - name: Engine tests on a minimal install
      run: |
        pip install -e '.[test]'
        pytest -q

    - name: Full suite and the import contracts
      run: |
        pip install -e '.[agents,test]'
        pytest -q
        # Must run against the repo source. In a venv holding an installed
        # older wheel it passes vacuously.
        lint-imports

    - name: Set test version
      run: |
        VERSION="${{ github.event.inputs.test_version || '0.0.0a1' }}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        # mirobody/__init__.py reads MIROBODY_VERSION at build time (see its docstring).
        echo "MIROBODY_VERSION=$VERSION" >> $GITHUB_ENV
        echo "Testing with version: $VERSION"

    - name: Build package
      run: |
        python -m build
        ls -la dist/
        echo "Built packages:"
        ls -1 dist/

    # The gate that would have caught the missing lfs above on its own: it
    # opens each artifact and refuses pointer-sized members. pypi-release.yml
    # has run this since 1.0.62; the test workflow never did, so CI could build
    # a hollow wheel and call it green.
    - name: Verify artifacts carry the engine data bundles
      run: python scripts/check_wheel_data.py dist/*

    - name: Check package with twine
      run: |
        twine check dist/*

    - name: Test package installation
      run: |
        # Test wheel installation
        pip install dist/*.whl
        python -c "import mirobody; assert mirobody.__version__ == '${{ env.VERSION }}', f'Version mismatch: {mirobody.__version__} != ${{ env.VERSION }}'"
        pip show mirobody
        pip uninstall -y mirobody

        # Test sdist installation
        pip install dist/*.tar.gz
        python -c "import mirobody; print(f'Successfully installed version: {mirobody.__version__}')"
        pip uninstall -y mirobody

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-python-${{ matrix.python-version }}
        path: dist/
        retention-days: 7

  test-import:
    needs: test-build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-python-${{ matrix.python-version }}
        path: dist/

    - name: Install and test package (Unix)
      if: runner.os != 'Windows'
      run: |
        pip install dist/*.whl
        python -c "import mirobody; print(f'Mirobody {mirobody.__version__} works on ${{ matrix.os }}')"

    - name: Install and test package (Windows)
      if: runner.os == 'Windows'
      run: |
        $wheel = Get-ChildItem -Path "dist" -Filter "*.whl" | Select-Object -First 1
        pip install $wheel.FullName
        python -c "import mirobody; print(f'Mirobody {mirobody.__version__} works on ${{ matrix.os }}')"

  summary:
    needs: [test-build, test-import]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Test Summary
      run: |
        echo "## 📊 Test Build Summary"
        echo ""
        if [ "${{ needs.test-build.result }}" == "success" ]; then
          echo "✅ Build tests passed for all Python versions"
        else
          echo "❌ Build tests failed"
        fi

        if [ "${{ needs.test-import.result }}" == "success" ]; then
          echo "✅ Import tests passed for all OS platforms"
        else
          echo "❌ Import tests failed"
        fi

        echo ""
        echo "Ready for release: ${{ needs.test-build.result == 'success' && needs.test-import.result == 'success' }}"
