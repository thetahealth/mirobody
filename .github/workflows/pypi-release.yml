name: PyPI Release

# Trigger conditions: push tag, create release on GitHub, or manual trigger
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'  # Support pre-release versions like 1.0.0-beta1
  release:
    types: [created]  # Trigger when release is created on github.com
  workflow_dispatch:  # Allow manual trigger
    inputs:
      test_mode:
        description: 'Test mode (do not publish to PyPI, do not create Release)'
        required: false
        default: 'true'  # Default to test mode
        type: choice
        options:
          - 'true'
          - 'false'
      target_branch:
        description: 'Display current running branch (for reference only, select branch on Actions page)'
        required: false
        default: 'Select branch on Actions page'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # lfs: true is load-bearing, not hygiene. The engine's data bundles
    # (mirobody/res/*.gz, *.npy, *.bin) live in Git LFS; a plain checkout
    # substitutes 133-byte pointer files, and the build happily packages those.
    # That is how 1.0.62 shipped a wheel whose `resolve` could never work.
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools wheel

    # Install package dependencies for testing
    - name: Install package dependencies
      run: |
        pip install -e .
      continue-on-error: true  # Some dependencies may not be available in CI environment

    # Run basic import test
    - name: Test package import
      run: |
        python -c "import mirobody; print(f'Mirobody imported successfully')"
      continue-on-error: true

    # Get version from tag or use test version
    - name: Set version from tag or manual trigger
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
          # If triggered by release creation on github.com
          VERSION="${{ github.event.release.tag_name }}"
          echo "🎯 Running on release: $VERSION"
        elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
          # If it's a tag push, use tag name as version
          VERSION=${GITHUB_REF#refs/tags/}
          echo "🎯 Running on tag: $VERSION"
        else
          # If manually triggered, generate PEP 440 compliant test version
          # Format: 0.0.0.devYYYYMMDDHHMMSS (dev number must be pure digits)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          VERSION="0.0.0.dev${TIMESTAMP}"

          echo "🧪 Manual test trigger on branch: $BRANCH_NAME"
          echo "📦 Test version: $VERSION"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        # mirobody/__init__.py reads MIROBODY_VERSION at build time (see its docstring).
        echo "MIROBODY_VERSION=$VERSION" >> $GITHUB_ENV
        echo "Setting version to $VERSION"

    # Build Python package
    - name: Build package
      run: |
        python -m build
        ls -la dist/

    # Both artifacts must carry the real data bundles, not LFS pointers —
    # twine uploads the sdist too, and pip serves it wherever the wheel doesn't
    # match. Without this gate a broken artifact reaches PyPI silently (1.0.62).
    - name: Verify artifacts carry the engine data bundles
      run: python scripts/check_wheel_data.py dist/*

    # Install from the SDIST, not only the wheel. The sdist must build itself,
    # and this project uses a custom `backend-path` backend to prune test
    # modules — if MANIFEST.in stops shipping it, `pip install <sdist>` dies at
    # "backend-path entry 'scripts' does not exist" before any of our code runs.
    # No wheel test can catch that; this one did.
    - name: Test sdist installs and runs
      run: |
        python -m venv "$RUNNER_TEMP/sdist-venv"
        "$RUNNER_TEMP/sdist-venv/bin/pip" install dist/*.tar.gz
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/sdist-venv/bin/mirobody" resolve "hemoglobin" "血红蛋白" 

    # Verify package contents
    - name: Check package
      run: |
        pip install twine
        twine check dist/*

    # Test package installation. `import mirobody` alone is not a test: it
    # passes on a wheel with pointer-file data. Exercise the front door the
    # README promises, from a directory that is NOT the source checkout.
    - name: Test package installation
      run: |
        WHEEL="$(ls "$PWD"/dist/*.whl)"   # absolute: the checks below run from $RUNNER_TEMP
        pip install "$WHEEL"
        cd "$RUNNER_TEMP"
        python -c "import mirobody; print(f'Version: {mirobody.__version__}')"
        mirobody resolve "LDL cholesterol" "hemoglobin" "血糖"
        python -c "
        from mirobody.engine import resolve
        r = resolve('hemoglobin')
        assert r.resolved and r.loinc, f'offline resolve is broken in the wheel: {r}'
        print('offline resolve OK:', r.loinc, r.canonical)
        "
        # ① The BARE install must import every module the engine advertises —
        # resolve, parse, vendors, file extraction — with no [server] extra, so
        # no FastAPI. `mirobody.utils` is listed first and by name: one dead
        # `from .auth import verify_token_string` in utils/permissions.py made
        # the engine's own utils package (hence anything calling execute_query)
        # unimportable without the extra, and no gate saw it.
        #
        # This step was added after the last release and had never run; when it
        # first did, it also asserted mirobody.task / mirobody.user here, which
        # cannot hold — a Redis-backed task queue and a Mandrill mailer really
        # do need [server]. Those moved to ② rather than being weakened away.
        python -c "
        import importlib.util
        assert importlib.util.find_spec('fastapi') is None, (
            'gate is vacuous: FastAPI is installed, so this cannot prove the '
            'engine imports without the [server] extra'
        )
        import mirobody.utils, mirobody.utils.permissions
        import mirobody.pulse, mirobody.pulse.file_parser
        import mirobody.indicator, mirobody.mcp, mirobody.engine
        print('engine imports clean on a bare (FastAPI-free) install')
        "
        # ② The engine/agent boundary, which needs [server] but must stay
        # langchain-free. This catches the break import-linter provably cannot
        # see: a module-scope import of mirobody.agent.chat.* executes
        # agent/__init__, and if that __init__ is eager it drags langchain into
        # an engine import. Exactly this happened to pulse.file_parser once.
        pip install "${WHEEL}[server]"
        python -c "
        import importlib.util
        assert importlib.util.find_spec('langchain_core') is None, (
            'gate is vacuous: langchain is installed, so this cannot prove the '
            'agent layer stays out of engine imports'
        )
        import mirobody.task.profile_refresh, mirobody.user
        import mirobody.agent.chat.user_profile
        print('engine/agent boundary holds on a langchain-free [server] install')
        "
        pip uninstall -y mirobody

    # Upload to TestPyPI
    - name: Publish to TestPyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        echo "Uploading to TestPyPI..."
        twine upload --repository testpypi dist/* || echo "TestPyPI upload failed (may already exist)"
      continue-on-error: true

    # Upload to PyPI (only for official tags or release events, and not in test mode)
    - name: Publish to PyPI
      if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.inputs.test_mode != 'true'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        echo "Uploading to PyPI..."
        twine upload --repository pypi dist/*
      continue-on-error: true

    # Create or update GitHub Release (upload build artifacts)
    - name: Upload to GitHub Release
      if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event.inputs.test_mode != 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(env.VERSION, 'a') || contains(env.VERSION, 'b') || contains(env.VERSION, 'rc') || contains(env.VERSION, 'dev') }}
        tag_name: ${{ env.VERSION }}
        name: "Release v${{ env.VERSION }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Optional: Print installation instructions
    - name: Print installation instructions
      run: |
        echo "🎉 Release $VERSION completed!"
        echo ""
        echo "📦 Install from TestPyPI:"
        echo "pip install -i https://test.pypi.org/simple/ mirobody==$VERSION"
        echo ""
        echo "📦 Install from PyPI:"
        echo "pip install mirobody==$VERSION"
        echo ""
        echo "📦 Or download from GitHub Release:"
        echo "https://github.com/${{ github.repository }}/releases/tag/$VERSION"