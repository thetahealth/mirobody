name: MCP Registry

# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io), the list GitHub's MCP registry, VS Code
# and most directories read. Until this existed server.json was never
# published, so a search for the project in those places found nothing, while
# directories still listed a retired Theta Health MCP whose repository is gone.
#
# Two triggers: workflow_call from pypi-release.yml after the PyPI upload is
# verified, and a manual dispatch for a version already on PyPI. Order matters:
# the registry accepts the entry only if the PyPI release of that version
# carries `mcp-name: ai.mirobody/mirobody` in its README.
#
# The `ai.mirobody/` namespace is proven by a DNS TXT record on mirobody.ai.
# One-time setup, done by whoever holds the mirobody.ai zone (Route 53) and
# repository admin:
#   openssl genpkey -algorithm Ed25519 -out key.pem      # OpenSSL 3
#   openssl pkey -in key.pem -pubout -outform DER | tail -c 32 | base64
#     -> TXT at the apex: mirobody.ai. "v=MCPv1; k=ed25519; p=<that base64>"
#   openssl pkey -in key.pem -noout -text | grep -A3 priv: | tail -n +2 | tr -d ' :\n'
#     -> secret MCP_REGISTRY_KEY on the `mcp-registry` environment, restricted
#        to release tags; then delete key.pem.
# The key can publish anything under ai.mirobody/, hence the environment.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag already on PyPI, for example 1.5.9
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Version tag already on PyPI, for example 1.5.9
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: mcp-registry
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Fail by name, not skip: a skipped publish leaves the registry on the
      # previous version while the release run stays green, the way the docs
      # dispatch in pypi-release.yml skips when its secret is unset.
      - name: Require the registry key
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_KEY" ]; then
            echo "::error::MCP_REGISTRY_KEY is not set on the mcp-registry environment; see the header of this workflow"
            exit 1
          fi

      - name: Check server.json names this version
        run: |
          version="$(jq -r .version server.json)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::server.json says $version, the tag is $TAG"
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Log in as mirobody.ai
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: ./mcp-publisher login dns --domain mirobody.ai --private-key "$MCP_REGISTRY_KEY"

      - name: Publish
        run: ./mcp-publisher publish

      # "publish exited 0" is the publisher's opinion; this asks the registry.
      - name: Verify the registry lists this version
        run: |
          name="$(jq -r .name server.json)"
          url="https://registry.modelcontextprotocol.io/v0.1/servers/$(jq -rn --arg n "$name" '$n|@uri')/versions/$TAG"
          for i in $(seq 1 12); do
            if curl -sfo /dev/null "$url"; then
              echo "The MCP Registry lists $name $TAG"
              exit 0
            fi
            echo "not visible yet, retrying in 10s ($i/12)"
            sleep 10
          done
          echo "::error::$name $TAG is not in the MCP Registry two minutes after publishing"
          exit 1
