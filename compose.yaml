services:
  pg:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-18062}:5432"
    environment:
      POSTGRES_USER: holistic_user
      POSTGRES_DB: ${PG_DBNAME:-holistic_db}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-REPLACE_THIS_VALUE_IN_PRODUCTION}
    volumes:
      - mirobody_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holistic_user -d ${PG_DBNAME:-holistic_db}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  mirobody: &mirobody
    image: ${MIROBODY_IMAGE:-thetahealth/mirobody:1.5.3}
    restart: unless-stopped
    env_file:
      - ${MIROBODY_ENV_FILE:-./docker/empty-environment}
    ports:
      - "${MIROBODY_HOST_PORT:-18060}:18060"
    environment: &mirobody_env
      ENV: ${ENV:-localdb}
      PYTHONUNBUFFERED: "1"
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "18060"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      PG_HOST: pg
      PG_PORT: "5432"
      PG_USER: holistic_user
      PG_DBNAME: ${PG_DBNAME:-holistic_db}
      PG_PASSWORD: ${PG_PASSWORD:-REPLACE_THIS_VALUE_IN_PRODUCTION}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-pg,localhost,127.0.0.1}
    volumes:
      - mirobody_upload:/app/.theta/mcp/upload
      - ${MIROBODY_CONFIG_FILE:-./docker/empty-config.yaml}:/app/config.${ENV:-localdb}.yaml:ro
    depends_on:
      pg:
        condition: service_healthy

  mirobody_worker:
    <<: *mirobody
    command: ["mirobody", "worker"]
    ports: []
    environment:
      <<: *mirobody_env
    healthcheck:
      disable: true
    depends_on:
      pg:
        condition: service_healthy
      mirobody:
        condition: service_healthy

volumes:
  mirobody_postgres:
  mirobody_upload:
