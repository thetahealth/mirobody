services:
  pg:
    # DOCKER_MIRROR ("docker.1ms.run/") is set by deploy.sh when the daemon
    # cannot reach Docker Hub.
    image: ${DOCKER_MIRROR:-}pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-18062}:5432"
    environment:
      POSTGRES_USER: holistic_user
      POSTGRES_DB: ${PG_DBNAME:-holistic_db}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-REPLACE_THIS_VALUE_IN_PRODUCTION}
    volumes:
      - mirobody_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holistic_user -d ${PG_DBNAME:-holistic_db}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  # Uploads written by 1.5.2 belong to root: it ran the app as root, and this
  # image runs as uid 10001, which could read them but not add one, so every
  # upload failed after an upgrade. One pass as root gives the volume to the
  # app's user before it starts, on every start, so a restored 1.5.2 archive
  # is covered too. Files it already owns are skipped. A mount that refuses
  # the change (NFS with root_squash) is reported and never blocks the start.
  mirobody_init:
    image: ${MIROBODY_IMAGE:-${DOCKER_MIRROR:-}thetahealth4mirobody/mirobody:1.5.3}
    user: "0:0"
    restart: "no"
    network_mode: none
    healthcheck:
      disable: true
    command:
      - sh
      - -c
      - >-
        find /app/.theta/mcp/upload \( ! -user mirobody -o ! -group mirobody \) -exec chown mirobody:mirobody {} +
        || echo 'mirobody_init: could not give /app/.theta/mcp/upload to uid 10001; uploads may fail' >&2
    volumes:
      - mirobody_upload:/app/.theta/mcp/upload

  mirobody: &mirobody
    image: ${MIROBODY_IMAGE:-${DOCKER_MIRROR:-}thetahealth4mirobody/mirobody:1.5.3}
    restart: unless-stopped
    env_file:
      - ${MIROBODY_ENV_FILE:-./docker/empty-environment}
    ports:
      - "${MIROBODY_HOST_PORT:-18060}:18060"
    environment: &mirobody_env
      ENV: ${ENV:-localdb}
      PYTHONUNBUFFERED: "1"
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "18060"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      PG_HOST: pg
      PG_PORT: "5432"
      PG_USER: holistic_user
      PG_DBNAME: ${PG_DBNAME:-holistic_db}
      PG_PASSWORD: ${PG_PASSWORD:-REPLACE_THIS_VALUE_IN_PRODUCTION}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      # host.docker.internal is a model server on this machine (LOCAL_BASE_URL):
      # through the proxy, every request to it would leave the machine.
      NO_PROXY: ${NO_PROXY:-pg,localhost,127.0.0.1,host.docker.internal}
    extra_hosts:
      # Docker Desktop resolves this name itself; Docker Engine on Linux needs the line.
      - "host.docker.internal:host-gateway"
    volumes:
      - mirobody_upload:/app/.theta/mcp/upload
      - ${MIROBODY_CONFIG_FILE:-./docker/empty-config.yaml}:/app/config.${ENV:-localdb}.yaml:ro
    depends_on:
      pg:
        condition: service_healthy
      mirobody_init:
        condition: service_completed_successfully

  mirobody_worker:
    <<: *mirobody
    command: ["mirobody", "worker"]
    ports: []
    environment:
      <<: *mirobody_env
    healthcheck:
      disable: true
    depends_on:
      pg:
        condition: service_healthy
      mirobody_init:
        condition: service_completed_successfully
      mirobody:
        condition: service_healthy

volumes:
  mirobody_postgres:
  mirobody_upload:
