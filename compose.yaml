services:
  pg:
    # pgvector is required, not a nicety: 00_init_schema.sql does
    # `CREATE EXTENSION vector` and 01_basedata.sql has vector(1024) columns
    # with an hnsw index — create_schema runs them at server startup.
    #
    # Pinned because the floating `pg17-trixie` tag drifts: machines that
    # pulled it in June hold 0.8.4 while upstream has moved to 0.8.6, so two
    # deploys of the same commit could run different pgvector builds.
    # ${DOCKER_MIRROR} is exported by deploy.sh when hub.docker.com is
    # unreachable (empty otherwise) — same fallback its inline ubuntu base uses.
    image: ${DOCKER_MIRROR:-}pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped
    # Docker's default /dev/shm is 64MB; hnsw index builds and parallel query
    # workers allocate dynamic shared memory well past that.
    shm_size: 256mb
    ports:
      # Loopback only: the app reaches pg via the internal 10.108.0.2, so the
      # host mapping exists purely for operator debugging — and the repo ships
      # a literal placeholder password, so it must not listen publicly.
      - "127.0.0.1:18082:5432"
    environment:
      POSTGRES_USER: holistic_user
      POSTGRES_DB: holistic_db
      POSTGRES_PASSWORD: REPLACE_THIS_VALUE_IN_PRODUCTION
    volumes:
      - mirobody_postgres:/var/lib/postgresql/data
    healthcheck:
      # Gates the app's create_schema: on first deploy initdb takes a while,
      # and `depends_on` without a condition only orders container STARTS.
      test: ["CMD-SHELL", "pg_isready -U holistic_user -d holistic_db"]
      interval: 5s
      timeout: 3s
      retries: 12
      # Failures inside start_period don't count toward retries: without it a
      # slow-disk initdb gets only 60s (12x5s) before `depends_on:
      # service_healthy` aborts the whole `compose up`.
      start_period: 30s
    networks:
      mirobody_network:
        # This address is load-bearing: config.yaml points PG_HOST at it.
        ipv4_address: 10.108.0.2

  redis:
    # 8.2 is the current LTS-ish line (EOL 2030-09); the 7.0 line stopped
    # receiving security fixes in early 2024. Verified: 8.2.8 boots and
    # answers AUTH with exactly the flags below.
    image: ${DOCKER_MIRROR:-}redis:8.2-alpine
    restart: unless-stopped
    # No healthcheck: it would duplicate the requirepass literal, and the app
    # retries its Redis connection anyway — restart + retry covers it.
    ports:
      # Loopback only — same reasoning as pg above.
      - "127.0.0.1:18089:6379"
    # Flag changes vs the original 7.0 config, none of them cosmetic:
    #   - noeviction (was allkeys-lru): the worker's task queues
    #     (BaseRedisTask: LPUSH/BLPOP lists, no TTL) and distributed locks
    #     live in this same instance — under allkeys-lru a full 512mb would
    #     silently evict queued tasks or a held lock. Failing writes loudly
    #     is the correct behaviour for durable data (which is also why
    #     appendonly is on).
    #   - `--protected-mode no` dropped: a no-op while requirepass is set,
    #     and the default (yes) fails safe if the password line ever goes.
    #   - `--io-threads-do-reads` dropped: deprecated no-op since 8.0 —
    #     reads are threaded whenever io-threads > 1.
    command: >
      redis-server
      --bind 0.0.0.0
      --port 6379
      --requirepass REPLACE_THIS_VALUE_IN_PRODUCTION
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfilename "appendonly.aof"
      --appendfsync everysec
      --loglevel notice
      --timeout 60
      --tcp-keepalive 30
      --io-threads 4
      --tcp-backlog 511
    volumes:
      # Without this the AOF sat in the container's writable layer, so every
      # deploy.sh run (`compose down`) discarded it — appendonly was
      # persistence theatre, and queued tasks died with each deploy.
      - mirobody_redis:/data
    networks:
      mirobody_network:
        # This address is load-bearing: config.yaml points REDIS_HOST at it.
        ipv4_address: 10.108.0.9

  mirobody: &mirobody_base
    # The image is built inline by deploy.sh (no Dockerfile in the repo);
    # it is a bare ubuntu + python venv shell — the code comes from the
    # `.:/app` mount and deps are installed into the site-packages volume
    # by the command below.
    image: mirobody
    restart: unless-stopped
    ports:
      - "18080:18080"
    command: >
      /bin/bash -c "
        cd /app/ &&
        source /root/venv/bin/activate &&
        HASH_FILE=/root/venv/lib/python3.12/site-packages/.deps_hash &&
        PYPROJ_HASH=$$(md5sum pyproject.toml requirements.txt | md5sum | awk '{print $$1}') &&
        if [ \"$$PYPROJ_HASH\" != \"$$(cat \"$$HASH_FILE\" 2>/dev/null)\" ]; then
          echo '>> deps changed, installing...' &&
          pip install --upgrade pip &&
          pip install -r requirements.txt &&
          echo \"$$PYPROJ_HASH\" > \"$$HASH_FILE\";
        else
          echo '>> deps unchanged, skip install';
        fi &&
        python -m mirobody serve
      "
    volumes:
      - .:/app
      - mirobody_upload:/app/.theta/mcp/upload
      - mirobody_charts:/app/.theta/mcp/charts
      - mirobody_site_packages:/root/venv/lib/python3.12/site-packages
    environment:
      # ENV must be passed even though the app also reads /app/.env itself:
      # Config.load_dotenv uses os.environ.setdefault, so only a real env var
      # lets `ENV=prod ./deploy.sh` override a stale .env from an earlier run.
      - ENV=${ENV}
      - CONFIG_SERVER=${CONFIG_SERVER}
      - CONFIG_TOKEN=${CONFIG_TOKEN}
      - PYTHONUNBUFFERED=1
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=18080
    healthcheck:
      # /api/health needs no auth; curl is in the deploy.sh image.
      #
      # start_period is the whole point here, and 60s was measured to be wrong:
      # failures inside it are free, so it must cover the FIRST BOOT, which
      # pip-installs the entire [agents] stack into the site-packages volume
      # before the server binds a port. 60s + 30x10s put the deadline at 6
      # minutes; on a 40 kB/s link that install is still downloading numpy at
      # that point, so the app flipped to `unhealthy` and the worker below —
      # gated on `service_healthy` — never left `Created`. The app itself was
      # fine and recovered on a later probe; the deploy had already failed.
      # 20 minutes costs nothing on a fast link (the first passing probe ends
      # it immediately) and is what a cold, slow first boot actually needs.
      test: ["CMD-SHELL", "curl -sf http://localhost:18080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1200s
    networks:
      # No static address: nothing resolves the app by IP (config.yaml only
      # pins pg/redis); it is reached via the published port.
      - mirobody_network
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_started

  mirobody_worker:
    <<: *mirobody_base
    # Worker process: consumes mirobody task queues (IndicatorSync, ProfileRefresh).
    # Inherits image / volumes / env / restart from `mirobody` via YAML anchor.
    # Waiting for mirobody to be HEALTHY (not merely started) is what
    # guarantees the pip install into the shared site-packages volume has
    # finished before the worker imports the package.
    ports: []
    command: >
      /bin/bash -c "
        cd /app/ &&
        source /root/venv/bin/activate &&
        python -m mirobody worker
      "
    healthcheck:
      # The anchor's HTTP healthcheck is meaningless here — the worker
      # serves nothing.
      disable: true
    networks:
      - mirobody_network
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_started
      mirobody:
        condition: service_healthy

networks:
  mirobody_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.108.0.0/24
          gateway: 10.108.0.1

volumes:
  mirobody_postgres:
  mirobody_redis:
  mirobody_upload:
  mirobody_charts:
  mirobody_site_packages:
